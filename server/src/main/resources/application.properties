# WallRunner Server Configuration
# 【跨设备联机】绑定到 0.0.0.0 表示监听所有网卡，局域网内其他设备均可访问
# 如果只想本机访问，可改为 127.0.0.1
server.address=0.0.0.0
server.port=8080
spring.application.name=wall-runner-server

# WebSocket
spring.websocket.max-text-message-size=65536
spring.websocket.max-binary-message-size=65536

# 注意：本文件仅用于基础设施配置（地址、端口等）。
# 玩家房间信息属于运行时动态数据，不应在此持久化。
# Dedicated Server 相关参数（tick间隔、广播频率、超时阈值等）使用代码内默认值。
